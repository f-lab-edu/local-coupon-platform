plugins {
	id 'java'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.springframework.boot' version '3.2.8' apply false
}

group = 'com.localcoupon'
version = '0.0.1-SNAPSHOT'

allprojects {
	repositories {
		mavenCentral()
	}
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'io.spring.dependency-management'

	java {
		toolchain { languageVersion = JavaLanguageVersion.of(17) }
	}

	ext {
		springCloudVersion = '2023.0.3'
	}
	dependencyManagement {
		imports {
			mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
		}
	}

	dependencies {
		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'
		testImplementation 'org.junit.jupiter:junit-jupiter'
	}

	tasks.withType(Test) {
		useJUnitPlatform()
	}
}

/** =========================
 *  서비스 모듈 공통(-service)
 *  - Spring Boot 실행 JAR
 *  - 공통 테스트 설정
 *  ========================= */
configure(subprojects.findAll { it.name.endsWith("-service") }) {
	apply plugin: 'org.springframework.boot'
	// 부트 모듈은 실행 JAR만 생성
	bootJar { enabled = true }
	jar { enabled = false }

	dependencies {
		// 각 서비스 공통으로 자주 쓰는 것들 원하면 여기서 추가 가능
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
	}
}

/** =========================
 *  공용/라이브러리 모듈(common 등)
 *  - 서비스가 아닌 모든 모듈에 적용
 *  - 라이브러리 JAR만 생성
 *  ========================= */
configure(subprojects.findAll { !it.name.endsWith("-service") && !it.name.endsWith("-domain") }) {
	tasks.matching { it.name == 'bootJar' }.configureEach { enabled = false }
	jar { enabled = true }
}
