server:
  port: 8081
services:
  other:
    base-url: http://localhost:8082
feign:
  client:
    config:
      default:
        loadbalancer: false
      storeClient:
        url: ${services.other.base-url}
      userClient:
        url: ${services.other.base-url}
spring:
  cloud:
    compatibility-verifier:
      enabled: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_SENDER}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}  # 기본값 update
    properties:
      hibernate:
        naming:
          physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
        format_sql: true
        use_sql_comments: true
        highlight_sql: true
    show-sql: false
  config:
    import: optional:file:./coupon-service/.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  output:
    ansi:
      enabled: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      access: read_only
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.localcoupon: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.web: DEBUG
    com.zaxxer.hikari: INFO
    org.hibernate.orm.jdbc.extract: trace

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

kakao:
  api:
    key: ${KAKAO_API_KEY}

monitoring:
  prometheus:
    url: http://127.0.0.1:9090

