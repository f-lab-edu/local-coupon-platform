plugins {
	id 'java'
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.slf4j:slf4j-api:2.0.9'
	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	// Spring Core / Web
	implementation 'org.springframework:spring-web:6.2.8'
	implementation 'org.springframework:spring-context:6.2.7'
	implementation 'org.springframework:spring-beans:6.1.5'
	implementation 'org.springframework:spring-core:6.1.5'

	// Spring AOP
	implementation 'org.springframework:spring-aop:6.1.5'
	implementation 'org.aspectj:aspectjweaver:1.9.21'

	// Jackson
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'

	// Validation
	implementation 'jakarta.validation:jakarta.validation-api:3.0.2'

	// 예외 핸들링 관련: ResponseEntity, @ExceptionHandler 등
	implementation 'org.springframework:spring-webmvc:6.1.14'

	// DB 예외 처리 (DataAccessException 등)
	implementation 'org.springframework:spring-jdbc:6.1.5'
	implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0' // EntityNotFoundException 대응
}


tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}
